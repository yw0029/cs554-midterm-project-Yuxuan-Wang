apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs554-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cs554-web
  template:
    metadata:
      labels:
        app: cs554-web
    spec:
      containers:
        - name: web
          image: cs554-midterm:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: SERVICE_NAME
              value: "cs554-midterm-kubernetes"
            - name: MESSAGE
              value: "Hello from Kubernetes!"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
